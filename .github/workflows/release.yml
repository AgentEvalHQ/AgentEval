name: Release to NuGet

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.0-alpha)'
        required: true
        type: string

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

# Least-privilege default token (SEC-03). The publish job pushes to nuget.org via
# NUGET_API_KEY (a secret, not GITHUB_TOKEN) and only uploads build artifacts, so the
# default token needs no more than read access to repository contents.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal
      env:
        AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
        AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}

    - name: Determine version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "release" ]; then
          VERSION="${{ github.event.release.tag_name }}"
          # Remove 'v' prefix if present
          VERSION="${VERSION#v}"
        else
          VERSION="${{ github.event.inputs.version }}"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Pack umbrella library
      run: dotnet pack src/AgentEval/AgentEval.csproj --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }} -p:PackageVersion=${{ steps.version.outputs.version }} --output ./nupkgs

    # T1.5 (v1.1): also pack the CLI as a dotnet-tool nupkg so users can
    # `dotnet tool install --global AgentEval.Cli --prerelease`. Multi-TFM
    # (net8.0;net10.0 — net9 STS was dropped in Phase 4 R4 review per
    # AgentEval.Cli.csproj; the dotnet-tool installer picks the highest
    # compatible runtime, so net10 hosts get net10 + net8 hosts get net8).
    - name: Pack CLI as dotnet tool
      run: dotnet pack src/AgentEval.Cli/AgentEval.Cli.csproj --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }} -p:PackageVersion=${{ steps.version.outputs.version }} --output ./nupkgs

    # Between the pack and the push, because a NuGet package cannot be recalled. 0.23.0-beta
    # shipped assemblies stamped 0.16.0.0: the pack passed -p:PackageVersion, which moves the
    # nupkg's version and nothing else, while AssemblyVersion / FileVersion /
    # InformationalVersion all derive from -p:Version. `AgentEvalVersion` in result provenance
    # reads Assembly.GetName().Version, so every result that release produced carried a version
    # that had not been current since 0.16 — and nothing failed, because nothing looked.
    - name: Verify the packed assemblies carry the release version
      shell: pwsh
      run: |
        $expected = '${{ steps.version.outputs.version }}'
        $numeric  = ($expected -split '-')[0]
        # No Add-Type: [IO.Compression.ZipFile] resolves natively on PowerShell 7, and the
        # System.IO.Compression.FileSystem assembly name is a .NET Framework spelling.
        $bad = @()
        foreach ($pkg in Get-ChildItem ./nupkgs/*.nupkg) {
          $dir = Join-Path $env:RUNNER_TEMP ("x_" + $pkg.BaseName)
          Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
          [IO.Compression.ZipFile]::ExtractToDirectory($pkg.FullName, $dir)
          foreach ($dll in Get-ChildItem $dir -Recurse -Filter 'AgentEval*.dll') {
            $info = [Diagnostics.FileVersionInfo]::GetVersionInfo($dll.FullName).ProductVersion
            $asm  = [Reflection.AssemblyName]::GetAssemblyName($dll.FullName).Version.ToString()
            if (-not $info.StartsWith($expected) -or -not $asm.StartsWith($numeric)) {
              $bad += "$($pkg.Name)/$($dll.Name): AssemblyVersion=$asm Informational=$info"
            }
          }
        }
        if ($bad) {
          Write-Host "::error::Packed assemblies do not carry $expected. Nothing was pushed."
          $bad | Select-Object -Unique | ForEach-Object { Write-Host "  $_" }
          exit 1
        }
        Write-Host "All packed AgentEval assemblies report $expected."

    - name: Verify the packed corpora are the corpora in this repository
      shell: pwsh
      run: |
        # The step above proves the packed assemblies carry the right VERSION. It does not prove they
        # carry the right CORPUS, and those are different failures: a glob that stops matching, a
        # stale obj/ artifact surviving an incremental build, or a corpus regenerated after the last
        # rebuild all ship a correct version number wrapped around the wrong bytes. Until this step
        # existed, the link between "the sidecar says 31d26e60" and "the bytes a consumer downloads
        # are 31d26e60" was held by the build being correct, not by anything checking.
        #
        # ALL FRAMEWORKS, NOT ONE. The package ships net8.0/net9.0/net10.0, each with its own
        # AgentEval.Memory.dll and its own embedded copy of every corpus. This repo has a recorded
        # multi-TFM stale-binary trap, and a per-TFM divergence is that trap wearing a corpus: a
        # consumer on net8 would probe different bytes than one on net10 while every published sha
        # names only one of them.
        $repoCorpora = Join-Path $env:GITHUB_WORKSPACE 'src/AgentEval.Memory/Data/typedmemeval'
        $sha = [System.Security.Cryptography.SHA256]::Create()
        function Get-NormalisedHash([string] $text) {
          # Exactly the sidecar convention: CRLF -> LF, UTF-8, SHA256. A check that normalised
          # differently would measure normalisation rather than content.
          $bytes = [System.Text.Encoding]::UTF8.GetBytes(($text -replace "`r`n", "`n"))
          return ((($sha.ComputeHash($bytes)) | ForEach-Object { $_.ToString('x2') }) -join '')
        }

        $expectedCorpora = @{}
        foreach ($f in Get-ChildItem $repoCorpora -Recurse -Filter '*.json') {
          if ($f.Name -like '*.meta.json') { continue }
          $expectedCorpora[$f.Name] = Get-NormalisedHash ([System.IO.File]::ReadAllText($f.FullName))
        }
        if ($expectedCorpora.Count -eq 0) {
          Write-Host "::error::No corpora found under $repoCorpora. Refusing to pass a check with nothing in it."
          exit 1
        }
        Write-Host "Reference corpora in the working tree: $($expectedCorpora.Count)"

        $failures = @()
        $mvids = @()
        $mvidByTfm = @{}
        $assertions = 0
        foreach ($pkg in Get-ChildItem ./nupkgs/*.nupkg) {
          $dir = Join-Path $env:RUNNER_TEMP ("c_" + $pkg.BaseName)
          Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
          [IO.Compression.ZipFile]::ExtractToDirectory($pkg.FullName, $dir)
          foreach ($dll in Get-ChildItem $dir -Recurse -Filter 'AgentEval.Memory.dll') {
            $tfm = Split-Path -Leaf (Split-Path -Parent $dll.FullName)
            $label = "$($pkg.Name)/$tfm"
            $asm = [Reflection.Assembly]::Load([IO.File]::ReadAllBytes($dll.FullName))
            # The MVID is unique per compilation. Collecting them lets the step PROVE it opened a
            # different assembly each time instead of trusting the loader not to hand back a cached
            # one -- a gate that verified a single framework three times would pass while two were
            # never read.
            $mvids += $asm.ManifestModule.ModuleVersionId
            # Keyed by FRAMEWORK, because the same assembly ships in more than one package.
            if (-not $mvidByTfm.ContainsKey($tfm)) { $mvidByTfm[$tfm] = @() }
            $mvidByTfm[$tfm] += $asm.ManifestModule.ModuleVersionId
            $seen = @{}
            foreach ($res in $asm.GetManifestResourceNames()) {
              if ($res -notmatch 'typedmemeval' -or $res -like '*.meta.json') { continue }
              $name = ($res -replace '^.*?([^.]+-v[0-9]+)\.json$', '$1') + '.json'
              $stream = $asm.GetManifestResourceStream($res)
              $ms = New-Object IO.MemoryStream
              $stream.CopyTo($ms)
              $actual = Get-NormalisedHash ([Text.Encoding]::UTF8.GetString($ms.ToArray()))
              if (-not $expectedCorpora.ContainsKey($name)) {
                $failures += "$label : embedded '$name' has no counterpart in the repository"
                continue
              }
              $seen[$name] = $true
              $assertions++
              if ($actual -ne $expectedCorpora[$name]) {
                $failures += "$label/$name : packed $($actual.Substring(0,16)) != repo $($expectedCorpora[$name].Substring(0,16))"
              }
            }
            # A framework that embedded nothing must fail loudly rather than contribute zero
            # comparisons and leave the totals looking healthy.
            foreach ($missing in ($expectedCorpora.Keys | Where-Object { -not $seen.ContainsKey($_) })) {
              $failures += "$label : '$missing' is MISSING from the packed assembly"
            }
          }
        }

        if ($mvids.Count -eq 0) {
          Write-Host "::error::No AgentEval.Memory.dll found in any package. Nothing was verified."
          exit 1
        }
        # COUNTED PER FRAMEWORK, NOT PER READ. AgentEval.Memory.dll ships in more than one package
        # -- the Memory package, the umbrella and the CLI -- so reading the same net8.0 build from
        # two packages is expected and duplicate MVIDs across packages prove nothing wrong. The
        # earlier form asserted distinct == reads and failed the 0.32.0-beta release on exactly
        # that: 5 assemblies read across 3 frameworks, 3 distinct MVIDs, which is correct.
        #
        # The hazard this guards is real and unchanged: the loader can hand back a cached assembly,
        # so a step that believes it opened net8/net9/net10 could have opened one of them three
        # times. The invariant that actually tests it is ONE DISTINCT MVID PER FRAMEWORK -- every
        # read of a given framework must agree, and different frameworks must differ.
        foreach ($tfm in $mvidByTfm.Keys) {
          $perTfm = ($mvidByTfm[$tfm] | Select-Object -Unique).Count
          if ($perTfm -ne 1) {
            Write-Host "::error::Framework $tfm produced $perTfm different MVIDs across packages -- the packages do not agree on which build they ship."
            exit 1
          }
        }
        $distinct = ($mvids | Select-Object -Unique).Count
        if ($distinct -ne $mvidByTfm.Keys.Count) {
          Write-Host "::error::Read $($mvidByTfm.Keys.Count) frameworks but only $distinct distinct MVIDs -- the loader handed back a cached assembly and some framework was never opened."
          exit 1
        }

        Write-Host "Frameworks verified: $($mvidByTfm.Keys.Count) ($($mvids.Count) assembly reads across packages, $distinct distinct builds)"
        Write-Host "Corpus assertions:   $assertions"
        if ($failures) {
          Write-Host "::error::Packed corpora do not match the repository. Nothing was pushed."
          $failures | Select-Object -Unique | ForEach-Object { Write-Host "  $_" }
          exit 1
        }
        Write-Host "All packed corpora are byte-identical to the repository."

    - name: Push to NuGet
      run: dotnet nuget push ./nupkgs/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Upload NuGet packages as artifacts
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages
        path: ./nupkgs/*.nupkg
        retention-days: 30
