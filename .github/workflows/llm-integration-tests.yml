name: LLM Integration Tests (On-Demand)

# This workflow runs integration tests that require actual LLM API calls.
# It's designed to be run on-demand (manually) or before releases to minimize costs.
# 
# Unit tests using FakeChatClient run in the standard CI workflow (ci.yml).
# These integration tests validate actual LLM behavior with real API calls.

on:
  # Manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      test_filter:
        description: 'Test filter pattern (e.g., "Integration" or specific test name)'
        required: false
        default: 'Category=Integration'
        type: string
      model:
        # THE DEFAULT IS THE CALIBRATED DEPLOYMENT, and that is the whole point of it. The judge's
        # shipped validity claim -- agreement 0.987 over 230 cases, prompt fingerprint
        # b1d3f721... -- was measured on gpt-5.5. A gate exercising a different model certifies
        # nothing about that claim: its green is decoration, and a regression on the deployment the
        # number describes would not turn it red.
        #
        # The schedule is weekly rather than daily for cost. If it ever needs to be cheaper, run the
        # calibrated judge LESS OFTEN rather than a different judge more often -- an honest weekly
        # beats a misleading daily. The cheaper models stay selectable for manual runs where the
        # question is "does the plumbing work", not "is the judge still valid".
        description: 'Deployment to test against. Default is the CALIBRATED judge deployment.'
        required: false
        default: 'gpt-5.5'
        type: choice
        options:
          - gpt-5.5
          - gpt-4o-mini
          - gpt-4o
          - gpt-4.1
      max_parallel_tests:
        description: 'Maximum parallel test runs (cost control)'
        required: false
        default: '1'
        type: string

  # Scheduled run - weekly on Monday at 6 AM UTC
  schedule:
    - cron: '0 6 * * 1'

  # Run on release tags (pre-release validation)
  push:
    tags:
      - 'v*'

# Required permissions for test-reporter to create check runs
# See: https://github.com/dorny/test-reporter#recommended-setup-for-public-repositories
permissions:
  contents: read
  actions: read
  checks: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  integration-tests:
    name: LLM Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Limit runtime to control costs

    # Only run if secrets are available
    # This prevents failures on forks that don't have API keys configured
    if: github.repository == 'AgentEvalHQ/AgentEval'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    # Which provider has secrets? This workflow fires on every release tag, and a tag is not the place to
    # discover that an OPTIONAL paid job has no credentials: an automatic run with none configured is
    # unconfigured, not broken, so it skips and says so. A human who asks for the run explicitly
    # (workflow_dispatch) gets an error instead, because they asked for something that cannot happen.
    - name: Select the inference provider
      id: provider
      # The secrets arrive through env, never interpolated into the script: `${{ secrets.X }}` is pasted
      # into the generated shell verbatim, so a key containing a quote or a backtick would change the
      # command it appears in.
      env:
        AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
        AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
        BITDEER_API_KEY: ${{ secrets.BITDEER_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        if [ -n "$AZURE_OPENAI_ENDPOINT" ] && [ -n "$AZURE_OPENAI_API_KEY" ]; then
          echo "provider=azure" >> "$GITHUB_OUTPUT"
          echo "✅ Azure OpenAI credentials present"
        elif [ -n "$BITDEER_API_KEY" ]; then
          echo "provider=bitdeer" >> "$GITHUB_OUTPUT"
          echo "✅ Bitdeer credentials present"
        elif [ -n "$OPENAI_API_KEY" ]; then
          echo "provider=openai" >> "$GITHUB_OUTPUT"
          echo "✅ OpenAI credentials present"
        else
          echo "provider=" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::error::No inference provider secrets are configured. Add AZURE_OPENAI_ENDPOINT + AZURE_OPENAI_API_KEY, or BITDEER_API_KEY, or OPENAI_API_KEY."
            exit 1
          fi
          echo "::notice::No inference provider secrets are configured; skipping the paid integration tests. This is not a failure — add BITDEER_API_KEY (or the Azure pair) to enable them."
        fi

    - name: Run Integration Tests
      if: steps.provider.outputs.provider != ''
      run: |
        echo "🧪 Running LLM Integration Tests"
        echo "   Filter: ${{ inputs.test_filter || 'Category=Integration' }}"
        echo "   Model: ${{ inputs.model || 'gpt-4o-mini' }}"
        echo "   Max Parallel: ${{ inputs.max_parallel_tests || '1' }}"
        
        dotnet test \
          --configuration Release \
          --no-build \
          --verbosity normal \
          --filter "${{ inputs.test_filter || 'Category=Integration' }}" \
          --logger "trx;LogFileName=integration-test-results.trx" \
          --logger "html;LogFileName=integration-test-results.html" \
          --results-directory ./test-results \
          -- RunConfiguration.MaxCpuCount=${{ inputs.max_parallel_tests || '1' }}
      env:
        # The CLI and the samples both resolve AI_INFERENCE_PROVIDER; naming it here makes the run's provider
        # explicit rather than auto-detected, so a half-configured secret set fails closed instead of
        # silently grading on another host.
        AI_INFERENCE_PROVIDER: ${{ steps.provider.outputs.provider }}
        AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
        AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
        AZURE_OPENAI_DEPLOYMENT: ${{ inputs.model || 'gpt-5.5' }}
        # Secondary model for comparison tests
        AZURE_OPENAI_DEPLOYMENT_2: ${{ inputs.model == 'gpt-4o' && 'gpt-4o-mini' || 'gpt-4o' }}
        BITDEER_API_KEY: ${{ secrets.BITDEER_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    - name: Upload Test Results
      uses: actions/upload-artifact@v7
      if: always() && steps.provider.outputs.provider != ''
      with:
        name: integration-test-results
        path: |
          ./test-results/**/*.trx
          ./test-results/**/*.html
        retention-days: 30

    - name: Publish Test Summary
      # SHA-pinned (SEC-04): third-party action; resolved from the v1 moving tag, kept current by Dependabot.
      uses: dorny/test-reporter@a53e41438c2381e621dc719a47a57180e30c7075 # v1
      if: always() && steps.provider.outputs.provider != ''
      with:
        name: LLM Integration Test Results
        path: './test-results/**/*.trx'
        reporter: dotnet-trx
        fail-on-error: true

    - name: Cost Estimation Summary
      if: always() && steps.provider.outputs.provider != ''
      run: |
        echo "## 💰 Cost Estimation" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| Model Used | ${{ inputs.model || 'gpt-4o-mini' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Run Date | $(date -u +'%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "💡 **Tip**: Use gpt-4o-mini for regular testing (cheaper). Reserve gpt-4o for pre-release validation." >> $GITHUB_STEP_SUMMARY

  # Samples validation - run all samples with mock data
  validate-samples:
    name: Validate Samples (Mocked)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore and Build
      run: |
        dotnet restore
        dotnet build --configuration Release --no-restore

    - name: Build Samples Project
      run: dotnet build samples/AgentEval.Samples --configuration Release --no-restore

    - name: Verify Samples Compile
      run: |
        echo "✅ All 21 samples compile successfully"
        echo "   Samples use FakeChatClient when API credentials unavailable"
