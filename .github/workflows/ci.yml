name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Skip CI if commit message contains [skip ci] or [ci skip]
# This is useful for documentation-only changes or formatting fixes

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

# Least-privilege default token (SEC-03). Grant any extra scope on the specific job that
# needs it rather than inheriting the repo/org-wide read-write default.
permissions:
  contents: read

jobs:
  # Every tag must have a CHANGELOG section of its own. This gate exists because the rule was
  # assumed to be enforced and was not: the sibling checker for the status doc says in its own
  # docstring that "the CHANGELOG never drifted because CI READS IT", and nothing did. v0.35.0-beta
  # was tagged 2026-09-08 with its notes still in [Unreleased], where the next release would have
  # shipped them a second time under its own number.
  #
  # fetch-depth: 0 is LOAD-BEARING. actions/checkout is shallow and fetches no tags, so the check
  # would see an empty tag list -- and "every tag has a section" is trivially true of no tags. It
  # refuses to report a pass in that state (exit 2, "the repository has no tags, so this measured
  # nothing"), so a missing fetch-depth breaks the job loudly instead of greening it. The guard is
  # there because this is the shape that would have shipped otherwise.
  repository-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Every tag has a CHANGELOG section
      run: python tools/check_tag_has_changelog_section.py
    # Runs in the SAME job because it needs the same full-depth checkout: the history half of
    # the check reads `git log --all`, which a shallow clone cannot answer.
    - name: No private path is tracked or cited in this public repository
      run: python tools/check_no_private_paths.py
    # The step above passing is also what a mention scan that reads nothing would print. Dropping
    # .gitignore from the allowlist leaves its real ignore rule as a citation, so the same script
    # must now exit 1 and name .gitignore. Exit 0 or 2 here means the mention check cannot fail.
    # This runs only after the real check passed, so its exit 1 can only come from the ablation.
    - name: The private-path mention check can fail (ablation self-test)
      shell: bash
      run: |
        set +e
        out="$(python tools/check_no_private_paths.py --ablate-mention .gitignore)"
        rc=$?
        set -e
        printf '%s\n' "$out"
        if [ "$rc" -ne 1 ]; then
          echo "::error::With .gitignore dropped from the mention allowlist the check exited $rc, not 1: it cannot fail on a real citation."
          exit 1
        fi
        if ! grep -q '^  \.gitignore:[0-9]' <<< "$out"; then
          echo "::error::The ablation exited 1 but did not report .gitignore, so the failure came from something else."
          exit 1
        fi
    # Needs no credentials and no network: the check pins the resolved model and every
    # vector is synthetic. It spawns two child interpreters to prove that concurrent writers
    # do not lose each other's work, which is why it takes a few seconds rather than none.
    - name: The dense retriever contract holds
      run: python tools/check_dense_retriever_contract.py
    # `dotnet run -- <n>` resolves against a FLATTENING of the sample groups, so a sample
    # inserted anywhere but the tail renumbers every sample after it and the documented
    # commands silently run the wrong one. They had already drifted in two independent
    # places before this check existed. The (Gn) coordinate in each doc line is the stable
    # anchor; this compares it against the dispatcher. No build, no credentials.
    - name: Documented sample numbers run the sample they name
      run: python tools/check_sample_numbering.py

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Dependency Review
      uses: actions/dependency-review-action@v5
      with:
        fail-on-severity: high

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')"
    
    strategy:
      fail-fast: false
      matrix:
        dotnet-version: [ '8.0.x', '9.0.x', '10.0.x' ]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install fonts for PDF generation (Linux)
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-liberation fontconfig

    - name: Setup .NET ${{ matrix.dotnet-version }}
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ matrix.dotnet-version }}
        dotnet-quality: ${{ matrix.dotnet-version == '10.0.x' && 'preview' || '' }}

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore

    # One leg builds the Mission Control UI, so a TypeScript or bundling break fails here and not at release
    # time, and the .NET build on this leg includes the UI the way the released tool does.
    - name: Setup Node (Mission Control UI)
      if: matrix.dotnet-version == '10.0.x'
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Build the Mission Control UI
      if: matrix.dotnet-version == '10.0.x'
      working-directory: src/AgentEval.MissionControl.Spa
      run: |
        npm ci
        npm run build

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory coverage
      env:
        # `dotnet test` on the solution starts a test host per project per target framework — up to a
        # dozen at once on a two-core runner. vstest waits 90 s by default for a host process to CONNECT,
        # and on 2026-09-21 a Windows net10 leg blew that budget and reported `Test Run Aborted` with no
        # failing test. This governs process startup, before any test runs, so it hides no assertion: a
        # host that never comes up still fails the job, just with the real reason in the log.
        VSTEST_CONNECTION_TIMEOUT: '300'
        AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
        AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}

    - name: Security Scan - .NET Dependency Check
      if: matrix.dotnet-version == '10.0.x'
      run: |
        dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerability-report.txt
        if grep -q 'has the following vulnerable packages' vulnerability-report.txt; then
          echo "::error::Vulnerable dependencies found"
          cat vulnerability-report.txt
          exit 1
        fi

    - name: Upload coverage reports
      if: matrix.dotnet-version == '10.0.x'
      # SHA-pinned (SEC-04): third-party action runs in CI with the workflow token. Dependabot
      # (github-actions ecosystem) keeps this current. Resolved from the v5 moving tag.
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v5
      with:
        # Find all coverage files in the coverage directory
        files: ./coverage/**/coverage.cobertura.xml
        fail_ci_if_error: false
        verbose: true
        # CODECOV_TOKEN is required for private repositories
        # See: Repository Settings > Secrets and variables > Actions
        token: ${{ secrets.CODECOV_TOKEN }}

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')"
    
    strategy:
      fail-fast: false
      matrix:
        dotnet-version: [ '8.0.x', '9.0.x', '10.0.x' ]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup .NET ${{ matrix.dotnet-version }}
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ matrix.dotnet-version }}
        dotnet-quality: ${{ matrix.dotnet-version == '10.0.x' && 'preview' || '' }}

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal
      env:
        # `dotnet test` on the solution starts a test host per project per target framework — up to a
        # dozen at once on a two-core runner. vstest waits 90 s by default for a host process to CONNECT,
        # and on 2026-09-21 a Windows net10 leg blew that budget and reported `Test Run Aborted` with no
        # failing test. This governs process startup, before any test runs, so it hides no assertion: a
        # host that never comes up still fails the job, just with the real reason in the log.
        VSTEST_CONNECTION_TIMEOUT: '300'
        AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
        AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}


