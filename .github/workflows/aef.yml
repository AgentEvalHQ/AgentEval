name: AEF

# The AEF specification's own checks (contracts/aef/GOVERNANCE.md, "Proposing a change"). Runs only when AEF changes:
# plain Python, standard library (jsonschema only for aef_schema's comparison self-test).
on:
  push:
    paths:
      - "contracts/aef/**"
      - ".github/workflows/aef.yml"
  pull_request:
    paths:
      - "contracts/aef/**"
      - "src/AgentEval.Results/**"
      - "tests/AgentEval.Results.Conformance/**"
      - ".github/workflows/aef.yml"

permissions:
  contents: read

jobs:
  aef:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # the generated limit vectors and the self-check's 40-odd corpus passes (in parallel)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the DCO check reads the commits

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Spec, schemas and corpus agree (every rule covered, nothing ignored by git)
        run: python -X utf8 -I contracts/aef/tools/check_spec.py

      - name: The corpus regenerates byte for byte
        run: |
          set -e
          cd contracts/aef/tools
          for tool in derive_reader build_conformance lane_vectors signature_vectors decision_vectors protocol_vectors write_vectors pin_vectors job_vectors build_index; do
            python -X utf8 -I "$tool.py" > /dev/null
          done
          cd "$GITHUB_WORKSPACE"
          git status --porcelain -- contracts/aef
          test -z "$(git status --porcelain -- contracts/aef)"

      - name: The reference verifier passes every vector, and the corpus catches every mutation
        run: |
          python -X utf8 -I contracts/aef/tools/aef_conformance.py --quiet
          python -X utf8 -I contracts/aef/tools/aef_conformance.py --self-check

      - name: Tool self-tests and checks
        run: |
          pip install --quiet jsonschema==4.26.0
          python -X utf8 -I contracts/aef/tools/aef_crypto.py --self-test
          python -X utf8 -I contracts/aef/tools/aef_schema.py --self-test
          python -X utf8 -I contracts/aef/tools/schema_diff.py --self-test
          python -X utf8 -I contracts/aef/tools/aef_decide.py --check
          python -X utf8 -I contracts/aef/tools/aef_stream.py --check
          # the reference runner beyond the job vectors: the protocol corpus's plans, the system clock, usage errors
          python -X utf8 -I contracts/aef/tools/check_runner.py
          python -X utf8 -I contracts/aef/tools/gen_reference.py --check
          python -X utf8 -I contracts/aef/tools/check_interop.py --quiet

      - name: Every commit that changes AEF carries a DCO sign-off
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -e
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No base to compare with (a new branch): checking the last commit only."
            BASE="$HEAD~1"
          fi
          missing=0
          for c in $(git rev-list "$BASE..$HEAD" -- contracts/aef); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "::error::commit $(git log -1 --format='%h %s' "$c") changes contracts/aef without a Signed-off-by line (GOVERNANCE.md, Contributions)"
              missing=1
            fi
          done
          exit $missing

  # Merge criterion 2 (GOVERNANCE.md): AgentEval's own implementation passes the vectors of every class it claims.
  # Pull requests only, net10.0 only: a .NET build and one process per vector cost minutes a push need not spend.
  aef-dotnet:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The classes it claims (IMPLEMENTATIONS.md): all nine, Runner through its scripted runner (the job vectors).
      - name: AgentEval.Results through the conformance runner (every class; Ed25519 signing is optional)
        run: >-
          bash tests/AgentEval.Results.Conformance/run-corpus.sh net10.0 --quiet --sign-algorithms ecdsa-p256
          --class Producer --class Sealer --class Reader --class "Run verifier" --class "Overlay verifier"
          --class "Checkpoint verifier" --class "Decision engine" --class "Stream verifier" --class Runner
