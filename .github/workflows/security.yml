name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 1' # Weekly scan on Mondays
  workflow_dispatch: {} # Allow manual runs against any branch / HEAD

# Skip if commit message contains [skip ci] or [ci skip]
# This is useful for documentation-only changes or formatting fixes

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

# Required permissions for SARIF upload to GitHub Security tab
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')"
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Restore dependencies
      run: dotnet restore

    - name: Run Security DevSkim Analyzer
      # SHA-pinned (SEC-04): third-party action; resolved from the v1 moving tag (was v1.0.16).
      # Dependabot (github-actions ecosystem) keeps it current.
      # See: https://github.com/microsoft/DevSkim-Action/releases
      uses: microsoft/DevSkim-Action@4b5047945a44163b94642a1cecc0d93a3f428cc6 # v1
      with:
        directory-to-scan: .
        output-filename: devskim-results.sarif
        # Path exclusions — content / generated / planning, not code:
        # - samples/.../Articles/Yaml: scenario content intentionally names
        #   weak hash algorithms (MD5/SHA-1) as the prohibited input the agent
        #   must refuse — not code that uses them.
        # - node_modules + docs/_site: generated content.
        # - strategy/: internal-only planning + calibration-baseline reports.
        # - Data/typedmemeval/ + the judge-calibration fixtures: generated benchmark corpora and
        #   their metadata sidecars. JSON cannot carry a suppression comment, and every finding in
        #   them is the same false positive — the 64-hex values DevSkim reads as leaked tokens are
        #   SHA-256 content hashes that exist precisely so a result can name the corpus that
        #   produced it. Data, not code.
        # Real source code under src/ and tests/ remains scanned.
        ignore-globs: "**/samples/**/Articles/Yaml/**,**/node_modules/**,**/_site/**,**/strategy/**,**/Data/typedmemeval/**,**/Data/typedmemeval-judge-calibration*.json"
        # Rule exclusions — informational rules that produce only false
        # positives in this codebase. Real-security rules (DS126858 weak
        # hash, DS148264 weak random, DS425040 untrusted deserialize) stay
        # active:
        # - DS137138 Insecure URL: launchSettings.json dev profile (never
        #   shipped) intentionally uses http://localhost.
        # - DS162092 debug code: Console.WriteLine in CLI commands is the
        #   point of a CLI; console.log in build-time vite/codegen config
        #   is intentional build feedback.
        # - DS172412 unsafe code: the few `unsafe` blocks are reviewed and
        #   intentional (PDF rendering, code-vuln eval scanner).
        # - DS176209 suspicious comment: TODO/HACK markers are normal dev
        #   markers, tracked separately in the planning docs.
        exclude-rules: "DS137138,DS162092,DS172412,DS176209"

    - name: Upload DevSkim scan results to GitHub Security tab
      if: always()
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: devskim-results.sarif
      continue-on-error: true  # Don't fail if GHAS is not available

    - name: Check for vulnerable NuGet packages
      run: |
        echo "Checking for vulnerable packages..."
        dotnet list package --vulnerable --include-transitive > vulnerability-report.txt 2>&1 || true
        
        if grep -q "The given project has no vulnerable packages" vulnerability-report.txt; then
          echo "✅ No vulnerable packages found"
        elif grep -q "has the following vulnerable packages" vulnerability-report.txt; then
          echo "❌ Vulnerable packages detected:"
          cat vulnerability-report.txt
          echo "::error::Vulnerable dependencies found. Please update affected packages."
          exit 1
        else
          echo "ℹ️ Unable to determine vulnerability status"
          cat vulnerability-report.txt
        fi

    - name: Check for hardcoded secrets
      run: |
        echo "Scanning for potential secrets..."
        
        # Check for common secret patterns in suspicious contexts (assignments, strings)
        # Exclude test files and legitimate code patterns
        SUSPICIOUS=$(grep -r -E "(api_key|apikey|secret_key|password)\s*[:=]" \
          --include="*.cs" --include="*.json" --include="*.yml" --include="*.yaml" \
          src/ samples/ 2>/dev/null | grep -v "// " | grep -v "GetEnvironmentVariable" || true)
        
        if [ -n "$SUSPICIOUS" ]; then
          echo "⚠️ Potential secrets found. Manual review required:"
          echo "$SUSPICIOUS"
        else
          echo "✅ No obvious hardcoded secrets detected"
        fi
        
        # Check for actual OpenAI API keys (sk-proj-... or sk-... patterns with actual key content)
        # These are 51+ character strings starting with sk-
        if grep -r -E "sk-[a-zA-Z0-9]{48,}" --include="*.cs" --include="*.json" src/ samples/ 2>/dev/null; then
          echo "❌ Potential OpenAI API key found in source code"
          echo "::error::API key patterns detected in source code"
          exit 1
        else
          echo "✅ No API key patterns found in source code"
        fi

    - name: Upload vulnerability report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: security-scan-results
        path: |
          vulnerability-report.txt
          devskim-results.sarif
        retention-days: 30