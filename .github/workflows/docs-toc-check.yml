name: Docs nav + corpus separability

# Catches the exact bug found 2026-07-19: a new docs/**/*.md file that's never added to docs/toc.yml (the
# real docfx site navigation) ships invisible in the sidebar. Also catches the reverse drift: docs/index.md's
# landing page linking to a page that's since been removed from toc.yml, or never added. Deliberately
# separate from docs.yml (which builds + deploys the site) so this stays fast and runs on every PR, not just
# pushes to main.
on:
  pull_request:
    paths:
      - 'docs/**/*.md'
      - 'docs/toc.yml'
      - 'tools/check_docs_toc.py'
      - 'src/AgentEval.Memory/Data/typedmemeval/**'
      - 'tools/typedmemeval_common.py'
      - 'tools/stamp_typedmemeval_separability.py'
      - 'tools/run_typedmemeval_probes.py'
      - 'tools/typedmemeval-separability-baseline.json'
      - 'tools/validate_typedmemeval_difficulty.py'
      - 'tools/gen_typedmemeval_*.py'

permissions:
  contents: read

jobs:
  check-toc:
    runs-on: ubuntu-latest
    # 5 was right when this job only checked the docs nav. The corpus checks have since grown onto
    # it and now dominate: the separability pass alone runs ~5.7 minutes across the five verticals,
    # 97% of it in the boilerplate n-gram screen, which scores every phrase recurring in at least a
    # fifth of questions against every session. Adding the role-order self-test and the difficulty
    # check tipped an already-marginal job over, and GitHub reports a timed-out job as *cancelled* —
    # which reads as "someone stopped it", not "your check never finished". That is a bad failure
    # mode for a gate, so the headroom is generous rather than tight.
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check every doc file is reachable from toc.yml
        run: python3 tools/check_docs_toc.py

      # ADR-026 V7. Re-measures gold/distractor separability over the shipped corpora rather than
      # trusting the stamped record — a record nobody re-runs is a claim, not a check. Model-free
      # and deterministic, so it needs no credentials.
      # Ratcheted against a recorded baseline of the features that block the CURRENT corpus
      # revision. Not an exemption: anything new, or anything worse than its recorded value,
      # still fails. The baseline can only shrink, and the revision cannot ship until it is
      # empty. Without this the check is uniformly red for the whole life of a blocked
      # revision, which means a separability regression introduced while fixing the old one
      # would land invisibly -- the exact failure mode the check exists to prevent.
      - name: Check TypedMemEval corpora are not separable by cheap features
        working-directory: tools
        run: python3 stamp_typedmemeval_separability.py --check --baseline typedmemeval-separability-baseline.json

      # The probes decide which questions are valid, so the screen that decides "did this response
      # reach the gold answer?" is itself load-bearing. It has been wrong twice — a word boundary typed as a
      # literal backspace byte silenced half its negative-gold guard, and a greedy number pattern
      # let a year the prompt itself supplied count as evidence — and both defects reported leaks
      # in corpora that had none. Pure functions, so this runs without credentials.
      # always(): the separability step above can be legitimately red for a whole corpus
      # revision (a blocked corpus is a finding, not a transient failure), and a sequential
      # job would then skip this one for weeks. A check that silently stops running is worse
      # than one that fails, because nothing announces it.
      - name: Check the TypedMemEval evidence screen
        if: always()
        working-directory: tools
        run: python3 run_typedmemeval_probes.py --self-test

      # The separability gate is only worth its green if something is known to turn it red. This
      # rebuilds the role-order defect the consuming project found in v4-episodic -- gold running
      # u|a|a|u|a while every distractor ran u|a|u|a|a -- and asserts the gate refuses it. It also
      # pins WHICH half does the refusing: the pooled AUC reads 0.615 and would pass the 0.75
      # threshold, so the distribution test is load-bearing and a future simplification that drops
      # it fails here rather than in a consumer's acceptance probe.
      # always(), for the same reason as the step above.
      - name: Check the TypedMemEval separability gate detects a role-order tell
        if: always()
        working-directory: tools
        run: python3 stamp_typedmemeval_separability.py --self-test

      # `difficulty` is a claim that some questions are harder, and the only thing that makes it a
      # measurement rather than a label is that the reference retriever slopes across the bands
      # while the answer model does not. Both halves are checked here against the shipped corpus,
      # so a stamp cannot outlive the gradient that justified it — Episodic's did, surviving on one
      # revision's session draw and reading validated at a drop of 0.14 after regeneration.
      # Deterministic: BM25 plus the recorded V1 outcomes, no credentials.
      - name: Check TypedMemEval difficulty stamps still match their gradients
        if: always()
        working-directory: tools
        run: python3 validate_typedmemeval_difficulty.py --check
