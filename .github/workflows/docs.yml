name: Documentation

on:
  release:
    types: [published]
  workflow_dispatch:
  # Also trigger on pushes to main that change docs (for testing)
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/AgentEval/**/*.xml'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        ref: main  # Always build docs from main branch to satisfy environment protection rules

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore

    - name: Build project
      run: dotnet build src/AgentEval/AgentEval.csproj --configuration Release --no-restore

    - name: Install DocFX
      run: dotnet tool install -g docfx

    - name: Generate API metadata
      working-directory: docs
      run: docfx metadata

    - name: Build documentation
      working-directory: docs
      run: docfx build

    - name: Setup Pages
      uses: actions/configure-pages@v6

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: docs/_site

  deploy:
    needs: build-docs
    runs-on: ubuntu-latest
    # Deploy on: push to main (docs changes), release, or manual trigger
    # This allows updating docs without a release
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
