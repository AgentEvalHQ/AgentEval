name: Gatekeeper offline samples

# Executes every offline-capable Gatekeeper sample (00–10 forced offline, 13–29 offline by design)
# so their ~150 deterministic Require/oracle invariants actually run in CI instead of only when a
# human clicks through the launcher. The samples throw on any invariant failure; the suite runner
# exits non-zero if any sample fails. Sample 11A is excluded (requires a consented live endpoint).
#
# Then the offline check of the WHOLE samples catalogue: every sample in its own process, no provider,
# non-interactive, stdin closed, each exit code compared with samples/AgentEval.Samples/offline-check-expected.txt
# (11 for a sample that needs a model, its real verdict for one that runs offline). It fails on a crash, a hang,
# an unexpected code, or a menu sample with no row. No secrets: the check also strips any provider variable.
on:
  pull_request:
    paths:
      - 'samples/AgentEval.Samples/**'
      - 'samples/AgentEval.TravelDemo/**'
      - 'samples/AgentEval.TravelDemo.Evals/**'
      # inputs the samples build from or read: a project reference, copied skills, datasets, interop fixtures
      - 'samples/AgentEval.HealthcareSafetyPack/**'
      - 'samples/AgentEval.AgentSkillsEval/skills/**'
      - 'samples/datasets/**'
      - 'samples/interop/**'
      - 'src/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'AgentEval.sln'
      - '.github/workflows/gatekeeper-offline-samples.yml'
  push:
    branches: [ main ]
    paths:
      - 'samples/AgentEval.Samples/**'
      - 'samples/AgentEval.TravelDemo/**'
      - 'samples/AgentEval.TravelDemo.Evals/**'
      # inputs the samples build from or read: a project reference, copied skills, datasets, interop fixtures
      - 'samples/AgentEval.HealthcareSafetyPack/**'
      - 'samples/AgentEval.AgentSkillsEval/skills/**'
      - 'samples/datasets/**'
      - 'samples/interop/**'
      - 'src/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'AgentEval.sln'
      - '.github/workflows/gatekeeper-offline-samples.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gatekeeper-offline-samples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gatekeeper-offline-samples:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AGENTEVAL_GATEKEEPER_FORCE_OFFLINE: 'true'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Run the TravelDemo offline self-test
        run: dotnet run --project samples/AgentEval.TravelDemo.Evals --configuration Release -- --selftest

      - name: Run the Gatekeeper offline sample suite
        run: dotnet run --project samples/AgentEval.Samples --configuration Release -- --gatekeeper-offline-suite

      - name: Run the offline check of every sample
        # Runs even when the Gatekeeper suite failed, so one run reports both.
        if: ${{ !cancelled() }}
        run: >-
          dotnet run --project samples/AgentEval.Samples --configuration Release --no-build --
          --offline-check --timeout 180 --logs "${{ runner.temp }}/offline-check"

      - name: Upload the offline check's per-sample logs
        # also when the job was cancelled or hit its time limit: a hang is exactly when the logs are needed
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: offline-sample-check-logs
          path: ${{ runner.temp }}/offline-check/*.log
          if-no-files-found: ignore
          retention-days: 7
